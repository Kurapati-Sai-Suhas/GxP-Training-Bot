[project]
name = "gxp-training-bot-backend"
version = "0.1.0"
description = "Django REST backend for the GxP Training Bot project"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.0,<6.0",
  "djangorestframework>=3.15,<4.0",
  "django-cors-headers>=4.3,<5.0",
  "python-dotenv>=1.0,<2.0",
  "psycopg[binary]>=3.1,<4.0",
  "PyMuPDF>=1.24,<2.0",
  "python-docx>=1.1,<2.0",
  "celery>=5.3,<6.0",
  "redis>=5.0,<6.0",
  "openai>=1.40,<2.0",
  "gunicorn>=22.0,<24.0",
  "whitenoise>=6.6,<7.0"
]

[tool.uv]
package = false
