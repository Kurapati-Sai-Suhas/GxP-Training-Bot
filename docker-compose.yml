# DEVELOPMENT stack: DEBUG on, Django's autoreloading dev server, no TLS.
# Convenient to work against; NOT a deployment target.
# For a production-shaped stack (DEBUG=False, gunicorn, secret required, secure cookies)
# use docker-compose.prod.yml -- see docs/DEPLOYMENT.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gxp
      POSTGRES_PASSWORD: gxp_pass
      POSTGRES_DB: gxp_training_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gxp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
      DATABASE_URL: postgres://gxp:gxp_pass@db:5432/gxp_training_bot
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    # Overrides the image's gunicorn CMD with the autoreloading dev server.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      # Any HTTP response proves the app is serving; 401 is the expected answer here and
      # is a perfectly good liveness signal.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/accounts/me/')\" 2>&1 | grep -q . || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery-worker:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "True"
      DATABASE_URL: postgres://gxp:gxp_pass@db:5432/gxp_training_bot
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    command: celery -A config worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
