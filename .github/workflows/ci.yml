name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gxp
          POSTGRES_PASSWORD: gxp_pass
          POSTGRES_DB: gxp_training_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gxp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations and test suite (against real Postgres)
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "False"
          DATABASE_URL: postgres://gxp:gxp_pass@localhost:5432/gxp_training_bot
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: |
          python manage.py migrate
          python manage.py test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # NOTE: frontend/package-lock.json is gitignored in this project, so `npm ci`
      # (which requires a committed lockfile) isn't usable here. `npm install` works
      # without one, at the cost of build reproducibility - committing the lockfile
      # and switching to `npm ci` is a worthwhile follow-up.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build
